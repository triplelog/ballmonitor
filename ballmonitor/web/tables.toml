# Live data tables on the public site: big CSVs served by tabdn's tabc table server
# (~/Desktop/portfolio/mathzetta/tabdn). Each [[table]] becomes a page at /tables/<id>/ with a
# filterable, sortable table; every query goes to the server, nothing is downloaded whole.
# The page loads tabview's embed script from the server itself (<server><path>web/vendor/tabview-embed.js).
#
# A table whose server address is blank is left off the site, so tables can be listed here before
# their server runs. Check them with `ballmonitor tables --check` (asks each server for its columns).

[servers]
# tabc.com --tables DIR serving Retrosheet's batting.com and pitching.com (tabdn
# examples/retrosheet, uploaded with tools/deploy/upload-table.sh). Address with a trailing slash:
# "https://data.tabdn.com/" once both tables are there.
# `order` is the columns the page shows, in that order; the rest can be ticked on in the table.
# `[table.labels]`: the column headers fans see (filters still use the names; the page's "What the
# columns mean" lists both). `[table.columns]`: what each name means.
retrosheet = "https://data.tabdn.com/"
# The tables built by `python -m ballmonitor.data_tables.build`: qb_games.com. (The NBA and WNBA
# tables were removed on 2026-11-10: their box scores are ESPN's / NBA.com's, whose terms don't allow
# republishing a statistics database; data_tables/README.md. build.py can still make them.)
sports = "https://data.tabdn.com/"

[[table]]
id = "batting-games"
title = "Big-league batting game logs"
summary = "Every player's batting line in every big-league game since 1897—5.7 million rows you can filter and sort."
sport = "Baseball"
server = "retrosheet"
path = "batting/"
backend = "tabc"
filter = "hr >= 3"
sort = { column = "date", desc = true }
order = ["date", "player", "team", "opp", "ab", "r", "h", "d", "t", "hr", "rbi", "w", "k", "sb"]
limit = 100
how = "Box scores from Retrosheet (retrosheet.org), with one row per player per game. Type a filter like hr >= 3 and team = \"NYA\" using the short column names listed under \"What the columns mean\", or click any column header to sort."
examples = [
  { label = "Three-homer games", filter = "hr >= 3", sort = { column = "date", desc = true } },
  { label = "Most hits in a game", filter = "ab > 0", sort = { column = "h", desc = true } },
  { label = "A hit every time up (5+ at-bats)", filter = "ab >= 5 and h = ab", sort = { column = "ab", desc = true } },
  { label = "10+ RBI games", filter = "rbi >= 10", sort = { column = "rbi", desc = true } },
  { label = "World Series lines, newest first", filter = "gametype = \"worldseries\"", sort = { column = "date", desc = true } },
]
[table.labels]
date = "Date"
player = "Player"
team = "Team"
opp = "Opp"
gametype = "Game"
lp = "Bat spot"
pa = "PA"
ab = "AB"
r = "R"
h = "H"
d = "2B"
t = "3B"
hr = "HR"
rbi = "RBI"
w = "BB"
iw = "IBB"
k = "SO"
hbp = "HBP"
sh = "SH"
sf = "SF"
sb = "SB"
cs = "CS"
gdp = "GDP"
roe = "ROE"
[table.columns]
date = "game date"
gametype = "regular season, world series, all-star …"
vishome = "v = away, h = home"
lp = "batting order spot"
pa = "plate appearances"
ab = "at-bats"
r = "runs"
h = "hits"
d = "doubles"
t = "triples"
hr = "home runs"
rbi = "runs batted in"
w = "walks"
iw = "intentional walks"
k = "strikeouts"
hbp = "hit by pitch"
sh = "sacrifice bunts"
sf = "sacrifice flies"
sb = "stolen bases"
cs = "caught stealing"
gdp = "grounded into double plays"
roe = "reached on error"

[[table]]
id = "pitching-games"
title = "Big-league pitching game logs"
summary = "Every pitcher's line in every big-league game since 1897—no-hitters, 15-strikeout gems, and marathon outings."
sport = "Baseball"
server = "retrosheet"
path = "pitching/"
backend = "tabc"
filter = "k >= 15"
sort = { column = "date", desc = true }
order = ["date", "player", "team", "opp", "ipouts", "h", "r", "er", "w", "k", "hr", "bfp", "decision"]
limit = 100
how = "Box scores from Retrosheet (retrosheet.org), with one row per pitcher per game. The Outs column counts outs recorded (27 = nine innings); in a filter it's ipouts, as in ipouts >= 27. Use the short names under \"What the columns mean\" when writing filters."
examples = [
  { label = "No-hitters", filter = "h = 0 and ipouts >= 27 and bfp > 0", sort = { column = "date", desc = true } },
  { label = "18+ strikeouts", filter = "k >= 18", sort = { column = "k", desc = true } },
  { label = "Complete-game shutouts since 1990", filter = "cg = 1 and r = 0 and year >= 1990", sort = { column = "k", desc = true } },
  { label = "Longest outings", filter = "ipouts >= 45", sort = { column = "ipouts", desc = true } },
]
[table.labels]
date = "Date"
player = "Player"
team = "Team"
opp = "Opp"
ipouts = "Outs (27 = 9 inn.)"
bfp = "Batters"
h = "H"
r = "R"
er = "ER"
w = "BB"
k = "SO"
hr = "HR"
gs = "Start"
cg = "Complete"
decision = "Decision"
[table.columns]
date = "game date"
ipouts = "outs recorded, 3 per inning: 27 is nine innings, 18 is six"
bfp = "batters faced"
h = "hits allowed"
r = "runs allowed"
er = "earned runs"
w = "walks"
k = "strikeouts"
hr = "home runs allowed"
gs = "started (1/0)"
cg = "complete game (1/0)"
decision = "W, L, S or blank"

[[table]]
id = "qb-games"
title = "NFL quarterback game logs"
summary = "Every NFL passer's regular-season and playoff game since 1999—400-yard outbursts, perfect passer ratings, and rough days."
sport = "Pro football"
server = "sports"
path = "qb_games/"
backend = "tabc"
filter = "yds >= 400"
sort = { column = "season", desc = true }
order = ["season", "week", "type", "player", "team", "opp", "cmp", "att", "yds", "td", "int", "rating", "sacks", "epa", "rush_yds"]
limit = 100
how = "Weekly NFL passing stats from nflverse (nflverse.com, CC BY 4.0), with one row for every player who threw a pass in a game. Rating is the official NFL passer rating for that game. Tip: if you sort by Rating or Yds/att, add att >= 15 to the filter so one-pass trick plays don't clog the top. Use the short names under \"What the columns mean\", like yds >= 400 and td >= 4."
examples = [
  { label = "400-yard games", filter = "yds >= 400", sort = { column = "yds", desc = true } },
  { label = "Perfect passer rating (20+ attempts)", filter = "rating >= 158.3 and att >= 20", sort = { column = "season", desc = true } },
  { label = "Best passer ratings (15+ attempts)", filter = "att >= 15", sort = { column = "rating", desc = true } },
  { label = "5+ touchdown passes", filter = "td >= 5", sort = { column = "td", desc = true } },
  { label = "4+ interceptions", filter = "int >= 4", sort = { column = "int", desc = true } },
  { label = "Best playoff games (15+ attempts)", filter = "type = \"POST\" and att >= 15", sort = { column = "epa", desc = true } },
  { label = "100 rushing yards by a QB", filter = "rush_yds >= 100 and pos = \"QB\"", sort = { column = "rush_yds", desc = true } },
]
[table.labels]
season = "Season"
week = "Week"
type = "Game"
player = "Player"
team = "Team"
opp = "Opp"
pos = "Pos"
cmp = "Comp"
att = "Att"
yds = "Yards"
td = "TD"
int = "INT"
rating = "Rating"
ypa = "Yds/att"
sacks = "Sacked"
sack_yds = "Sack yds"
air_yds = "Air yds"
first_downs = "1st downs"
epa = "Pts added"
cpoe = "Comp % +/-"
rush = "Rushes"
rush_yds = "Rush yds"
rush_td = "Rush TD"
fumbles_lost = "Fumbles lost"
fantasy = "Fantasy pts"
[table.columns]
type = "REG = regular season, POST = playoffs"
pos = "position (non-quarterbacks who threw a pass are in too)"
cmp = "completions"
att = "pass attempts"
yds = "passing yards"
td = "touchdown passes"
int = "interceptions"
rating = "NFL passer rating (0 to 158.3); filter on att >= 15 to leave out trick-play passes"
ypa = "yards per attempt"
sacks = "times sacked"
sack_yds = "yards lost to sacks"
air_yds = "air yards (2006 on; 0 before)"
first_downs = "passing first downs"
epa = "expected points added on passes"
cpoe = "completion % over expected (2006 on; 0 before)"
rush = "rushing attempts"
rush_yds = "rushing yards"
rush_td = "rushing touchdowns"
fumbles_lost = "fumbles lost"
fantasy = "fantasy points (standard)"
