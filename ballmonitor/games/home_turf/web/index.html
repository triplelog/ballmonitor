<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home Turf · Ball Monitor</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <a class="back" href="/">← Ball Monitor</a>
    <h1>Home Turf</h1>
    <p id="status" class="status" aria-live="polite"></p>
    <nav class="tools">
      <button type="button" id="btn-new">New game</button>
      <button type="button" id="btn-saves">Saves</button>
      <button type="button" id="btn-settings">Settings</button>
      <button type="button" id="btn-help">How to play</button>
    </nav>
  </header>
  <main class="layout">
    <section class="board">
      <svg id="map" viewBox="0 0 1030 730" role="img" aria-label="Map of territories"></svg>
      <div id="legend" class="legend"></div>
    </section>
    <aside class="side">
      <div id="panel" class="panel"></div>
      <div id="info" class="panel"></div>
      <details class="panel" open>
        <summary>Game log</summary>
        <ol id="log" class="log" reversed></ol>
      </details>
    </aside>
  </main>
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true"><div class="modal-box" id="modal-box"></div></div>
  <script src="engine.js"></script>
  <script src="game.js"></script>
</body>
</html>
