name = "Pacific Rim"
region = "west"
members = ["AK", "HI", "Japan", "South Korea", "Taiwan", "Australia", "Guam", "American Samoa", "Philippines", "China", "Singapore", "Indonesia", "South Vietnam", "Saudi Arabia", "Afghanistan"]
