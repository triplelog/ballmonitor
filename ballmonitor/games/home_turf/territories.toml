# Home Turf's map: territories (birthplaces grouped so each has a real bench), the regions that give
# bonus call-ups, and who borders whom. Edit freely; build.py checks that every birthplace lands in
# one territory, that borders go both ways and that every region is connected.
#
# members: Lahman birthState codes (USA) or birthCountry names. x, y: position on the map.
# links: the territories it borders (by land or sea; all drawn as solid lines). bend: { neighbour = px }
# draws that border curved below the straight line (so it doesn't cross other territories).
# 2026-11-22 (owner): 40 territories, so the draft splits evenly, 10 each (one California, one Pennsylvania,
# Massachusetts with Connecticut and Rhode Island), 7 regions:
# Desert Southwest in the West, Texas in the South, Oklahoma in the Plains, Mexico in Latin America.

[regions]
west = { name = "West", bonus = 3, color = "#2e86de" }
plains = { name = "Plains & Prairies", bonus = 4, color = "#b8a92b" }
great_lakes = { name = "Great Lakes", bonus = 3, color = "#16a085" }
northeast = { name = "Northeast", bonus = 3, color = "#8e44ad" }
upper_south = { name = "Upper South", bonus = 3, color = "#6ab04c" }
south = { name = "South", bonus = 6, color = "#c0392b" }
latin_america = { name = "Latin America", bonus = 3, color = "#e84393" }

