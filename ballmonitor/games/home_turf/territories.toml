# Home Turf's map: territories (birthplaces grouped so each has a real bench), the regions that give
# bonus call-ups, and who borders whom. Edit freely; build.py checks that every birthplace lands in
# one territory and that borders go both ways.
#
# members: Lahman birthState codes (USA) or birthCountry names; "CA-S"/"CA-N" split California at
# 35.8°N and "PA-E"/"PA-W" split Pennsylvania at 77.5°W (from the birthplace map's geocoding).
# x, y: position on the 1000 x 700 map. land: land borders; sea: sea lanes (drawn dashed).

[regions]
pacific_coast = { name = "Pacific Coast", bonus = 3, color = "#3b7dd8" }
north_country = { name = "North Country", bonus = 2, color = "#6a8caf" }
southwest = { name = "Southwest", bonus = 2, color = "#d9822b" }
heartland = { name = "Heartland", bonus = 2, color = "#b5892e" }
great_lakes = { name = "Great Lakes", bonus = 4, color = "#2f9e8f" }
northeast = { name = "Northeast", bonus = 4, color = "#8e44ad" }
new_england = { name = "New England", bonus = 2, color = "#c0392b" }
upper_south = { name = "Upper South", bonus = 2, color = "#7d9d3c" }
atlantic_coast = { name = "Atlantic Coast", bonus = 2, color = "#16a085" }
gulf_coast = { name = "Gulf Coast", bonus = 3, color = "#e67e22" }
caribbean = { name = "Caribbean", bonus = 3, color = "#d35400" }
overseas = { name = "Overseas", bonus = 1, color = "#7f8c8d" }

[territories.socal]
name = "Southern California"
region = "pacific_coast"
members = ["CA-S"]
x = 120
y = 420
land = ["norcal", "mountain_west", "southwest", "central_america"]
