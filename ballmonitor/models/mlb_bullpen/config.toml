[formulas.fatigue_penalty]
expr = "penalty_pitched_yesterday * yesterday + penalty_back_to_back * back_to_back + penalty_three_straight * three_straight + penalty_per_10_pitches_3d * pitches_3d / 10 + penalty_high_workload_yesterday * high_workload"
description = "Total rest and workload penalty; components evaluated against trailing workload ledger."
variables = ["yesterday", "back_to_back", "three_straight", "pitches_3d", "high_workload"]

[formulas.appear_logit]
expr = "role_intercept + calib_slope * logit_sim + tendency_weight * log_ratio + blend_weight_direct * logit_direct"
description = "Log-odds of the reported appearance probability: recalibrated simulation frequency (role_intercept = calib_intercept_<role>) + team usage tendency + optional direct-model blend."
variables = ["logit_sim", "role_intercept", "log_ratio", "logit_direct"]


[formulas.reliever_rating]
expr = "(ra_runs + runs_prior_outs * runs_prior_rate) / (ra_outs + runs_prior_outs)"
description = "Reliever run-prevention rating (runs per out): runs on the mound over earlier relief outings, shrunk toward runs_prior_rate with runs_prior_outs pseudo-outs."
variables = ["ra_runs", "ra_outs"]

[formulas.bullpen_runs_vs]
expr = "runs_scale * (expected_runs - expected_outs * baseline_rate)"
description = "Bullpen runs vs a baseline: expected_runs = sum of expected outs x rating, expected_outs = their sum, baseline_rate = runs_league_rate ('vs average') or the usual-mix rating ('vs usual')."
variables = ["expected_runs", "expected_outs", "baseline_rate"]
