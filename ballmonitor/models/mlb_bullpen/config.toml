[meta]
title = "MLB bullpen usage"
version = "0.6.0"
status = "calibrated"
question = "Which relievers will pitch out of the bullpen in today's game?"
assumptions = [
  "Bullpen calls follow a softmax over score = role base + situation bonus + recent usage + platoon - fatigue, with weights fitted on 2025 calls.",
  "Roles not given are inferred from recent saves, holds and outs per outing.",
  "Relievers who pitched max_consecutive_days days in a row, max_pitches_yesterday+ yesterday or max_pitches_3d+ over 3 days are unavailable.",
  "Plate appearances use league-average event rates with a simple platoon split; pitcher, batter and team quality are ignored.",
  "Starters are hooked by pitch count vs stamina, times through the order, late innings and jams; relievers usually pitch one inning.",
  "The MLB 3-batter minimum rule is enforced before a reliever can be removed mid-inning.",
  "Reported P(appear) blends the recalibrated simulation with a direct logistic model on pre-game features, plus a team bullpen-usage tendency term; P(first) blends the simulation with a direct first-reliever model. All weights were fitted on 2025.",
  "Relievers marked active = false (IL, optioned, DFA) cannot pitch; the pool should be today's active roster.",
  "Bullpen runs: each reliever's runs on the mound per out over earlier relief outings, shrunk heavily toward a prior; expected outs from the usage model; the bullpen sum is scaled by runs_scale (fitted on 2025). Inherited runners count against the pitcher on the mound; park, defence and opponent are not modelled. Per-game bullpen runs are very noisy: the predictable part is a few tenths of a run.",
]

[params.starter_stamina_default]
value = 90.0
description = "Default expected pitch limit for starting pitcher before hook probability spikes."
source = "Modern MLB starter averages (Statcast 2021-2024)."
range = [50.0, 115.0]

[params.penalty_pitched_yesterday]
value = 0.81
description = "Score penalty if reliever pitched yesterday (1 day rest penalty)."
source = "Fitted: conditional logit on 30k 2025 bullpen calls (train only); RESEARCH.md section 2."
range = [0.0, 10.0]

[params.penalty_back_to_back]
value = 1.98
description = "Score penalty if reliever pitched on both of the last two days."
source = "Fitted: conditional logit on 30k 2025 bullpen calls (train only); RESEARCH.md section 2."
range = [0.0, 10.0]

[params.penalty_three_straight]
value = -0.0
description = "Extreme penalty if reliever pitched on 3 consecutive days."
source = "Not identifiable: 3 straight days is a hard rule (max_consecutive_days = 3), so the fit has no such candidates. Raise only if you relax that rule."
range = [0.0, 25.0]

[params.penalty_per_10_pitches_3d]
value = 0.26
description = "Score penalty per 10 pitches thrown over trailing 3 days."
source = "Fitted: conditional logit on 30k 2025 bullpen calls (train only); RESEARCH.md section 2."
range = [0.0, 5.0]

[params.penalty_high_workload_yesterday]
value = 1.08
description = "Score penalty if reliever threw 25+ pitches yesterday."
source = "Fitted: conditional logit on 30k 2025 bullpen calls (train only); RESEARCH.md section 2."
range = [0.0, 10.0]

[params.li_extreme_threshold]
value = 2.8
description = "Leverage Index (LI) threshold for extreme/fireman jam situations."
source = "Tom Tango LI convention."
range = [1.5, 6.0]

[params.off_day_tomorrow_discount]
value = 1.0
description = "Workload fatigue penalty discount if team has a scheduled off-day tomorrow."
source = "Fitted: grid on 2025 calls (train log-likelihood); RESEARCH.md section 2."
range = [0.0, 1.0]

[params.platoon_bonus]
value = 0.63
description = "Score bonus when reliever hand matches platoon advantage vs upcoming 3 batters."
source = "Fitted: conditional logit on 30k 2025 bullpen calls (train only); RESEARCH.md section 2."
range = [0.0, 3.0]

[params.temperature]
value = 1.0
description = "Softmax temperature over reliever scores (1 = as fitted; higher = less predictable choices)."
source = "1 = the fitted logit coefficients as-is (RESEARCH.md section 2); raise for less predictable managers."
range = [0.1, 5.0]

[params.num_simulations]
value = 500
description = "Number of Monte Carlo game simulations to run."
source = "Computational efficiency tradeoff."
range = [50, 5000]

[params.seed]
value = 42
description = "Random seed for the Monte Carlo simulation (same seed = same result)."
source = "Reproducibility convention."
range = [0, 1000000000]

# --- Availability (hard rest rules) ---------------------------------------

[params.max_consecutive_days]
value = 3
description = "Reliever is unavailable today after pitching on this many consecutive days (up to yesterday)."
unit = "days"
source = "RESEARCH.md section 3: 2025 relief appearance rate by workload (train only); rate above the threshold <= 2%."
range = [2, 5]

[params.max_pitches_yesterday]
value = 35
description = "Reliever is unavailable today after throwing this many pitches or more yesterday."
unit = "pitches"
source = "RESEARCH.md section 3: 2025 relief appearance rate by workload (train only); rate above the threshold <= 2%."
range = [15, 80]

[params.max_pitches_3d]
value = 70
description = "Reliever is unavailable today after this many pitches or more over the last 3 days."
unit = "pitches"
source = "RESEARCH.md section 3: 2025 relief appearance rate by workload (train only); rate above the threshold <= 2%."
range = [25, 120]

[params.high_workload_pitches]
value = 25
description = "Pitches yesterday at or above which `high_workload` = 1 in the fatigue_penalty formula."
unit = "pitches"
source = "Judgement."
range = [10, 60]

# --- Game engine ---------------------------------------------------------

[params.pa_rates_batter_edge]
value = [0.2, 0.1, 0.16, 0.055, 0.035]
description = "Plate-appearance probabilities [strikeout, walk/HBP, single, double, home run] when the batter has the platoon edge (opposite hand or switch hitter); the rest are outs in play."
source = "Set so simulated runs per team-game (both sides) are about the 2025 average of 4.46 (train data; RESEARCH.md engine check); platoon split by judgement."

[params.pa_rates_pitcher_edge]
value = [0.245, 0.08, 0.145, 0.045, 0.028]
description = "Plate-appearance probabilities [strikeout, walk/HBP, single, double, home run] when the pitcher has the platoon edge (same hand)."
source = "Set so simulated runs per team-game (both sides) are about the 2025 average of 4.46 (train data; RESEARCH.md engine check); platoon split by judgement."

[params.offense_runs_cdf]
value = [0.73, 0.87, 0.945, 0.982]
description = "Our team's runs per half-inning as a cumulative distribution [P(0), P(<=1), P(<=2), P(<=3)]; 4+ runs = 4-6."
source = "Set so simulated runs per team-game (both sides) are about the 2025 average of 4.46 (train data; RESEARCH.md engine check); platoon split by judgement."

[params.pitches_per_pa]
value = 3.65
description = "Mean pitches per plate appearance in the simulated game (drives pitch-count hooks)."
unit = "pitches"
source = "Engine grid on a home/away-balanced 2025 train sample (v0.5.0): matches pool relievers per game and starter outs; RESEARCH.md section 2.2."
range = [3.0, 5.0]

[params.pitches_per_pa_sd]
value = 1.25
description = "Standard deviation of pitches per plate appearance (rounded normal, clipped to 1..12)."
unit = "pitches"
source = "Judgement (carried over from v0.3)."
range = [0.5, 3.0]

