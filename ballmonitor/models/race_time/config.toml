[meta]
title = "Race time prediction"
version = "0.5.0"
status = "calibrated"
question = "What finish time will this runner achieve at any target distance, and how wide is the realistic range around it?"
description = "Weighted Riegel: each of your races is projected to the target with Riegel's power law (gender-specific exponent) and the projections are averaged, giving more weight to races near the target distance and to recent races. The bands (50/80/95%) are quantiles of the real errors of 2,560 linked Ohio RunSignup runners, widening with distance extrapolation and old races and narrowing with more races; checked on 2,440 other runners. Course and weather adjustments (DRAFT) scale the median and bands. The v0.4.0 curve method stays available (method = curve)."
assumptions = [
    "Your races follow Riegel's power law: time grows as distance ** b, b = 1.09 for men, 1.06 for women, 1.07 if gender is not given.",
    "Races close to the target distance and recent races say more about the target than far-away or old ones (weights halve per year and fall with distance ratio).",
    "Race-to-race variation dominates: even a perfect method misses a typical recreational runner by ~6-7% on a given day.",
    "Your errors look like those of 2,560 Ohio road racers (2018-2025, RunSignup-timed): bands are their measured error quantiles, not a normal curve.",
    "Bands are asymmetric where the data are: a single input race leaves more room to run much faster (it may have been a jog); old races leave more room to run slower.",
    "Course and weather adjustments (elevation, altitude, heat) are literature/judgement values and were not part of the calibration.",
]

[params.method]
value = "weighted_riegel"
description = "Prediction method: weighted_riegel (v0.5.0 default: weighted Riegel + empirical bands) or curve (v0.4.0: log-quadratic curve, Empirical Bayes slope, fitness transfer, normal sigma)."
unit = "choice"
source = "RESEARCH_BANDS.md (research_bands.py): weighted_riegel test MAPE and band coverage vs the v0.4.0 curve on 2,440 test runners"
choices = ["weighted_riegel", "curve"]

[params.riegel_exponent]
value = 1.07
description = "Riegel exponent b in T = t * (D / d) ** b when gender is not given (weighted_riegel)."
unit = "exponent"
source = "RESEARCH_BANDS.md (research_bands.py): b minimising train MAPE over all 2,560 train runners, grid 1.00-1.12 step 0.01 (Riegel 1981: 1.06)"
range = [0.95, 1.25]

[params.exponent_offset_male]
value = 0.02
description = "Added to riegel_exponent for men (gender = M) -> b = 1.09."
unit = "exponent"
source = "RESEARCH_BANDS.md (research_bands.py): men's b minimising train MAPE (1,216 train men) minus riegel_exponent"
range = [-0.15, 0.15]

[params.exponent_offset_female]
value = -0.01
description = "Added to riegel_exponent for women (gender = F) -> b = 1.06."
unit = "exponent"
source = "RESEARCH_BANDS.md (research_bands.py): women's b minimising train MAPE (1,344 train women) minus riegel_exponent; cf. RESEARCH_SIMPLE.md method E (women ~0.04 lower)"
range = [-0.15, 0.15]

[params.race_weight_distance_scale]
value = 1.0
description = "Race weight falls as exp(-|ln(D/d)| / this): a race at half or double the target distance keeps exp(-0.69) = 50% weight (weighted_riegel)."
unit = "ln-ratio"
source = "RESEARCH_SIMPLE.md (research_simple.py, method C): grid 0.25-2 and off, chosen on 2,560 train runners"
range = [0.1, 100.0]

[params.race_weight_half_life_years]
value = 1.0
description = "Race weight halves for every this-many years the race is before the target (weighted_riegel)."
unit = "years"
source = "RESEARCH_SIMPLE.md (research_simple.py, method C): grid 0.25-2 and off, chosen on 2,560 train runners"
range = [0.1, 100.0]

[params.race_combination]
value = "geometric"
description = "How race projections are averaged: geometric (weighted mean of log times) or arithmetic (weighted mean of times) (weighted_riegel)."
unit = "choice"
source = "RESEARCH_SIMPLE.md method C (geometric); the bands were fitted with geometric"
choices = ["geometric", "arithmetic"]

