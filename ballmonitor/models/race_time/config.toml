unit = "%/1000m"
source = "Bassett & Howley (1997) VO2max hypoxic reduction"
range = [0.0, 15.0]

[params.heat_penalty_per_deg]
value = 0.06
description = "Pace slowdown percentage per degree of (Temp + DewPoint - 100°F)."
unit = "%/°F"
source = "DRAFT (Judgement; common 'temp + dew point' runner's rule of thumb) — verify against Ely et al. 2007"
range = [0.0, 0.25]

[params.weather_dist_exponent]
value = 0.15
description = "Heat penalty grows with distance as (D / 5000 m) ** weather_dist_exponent."
unit = "exponent"
source = "Judgement"
range = [0.0, 0.5]

[params.assumed_dew_point_ratio]
value = 0.75
description = "When a race gives temp_f but neither dew_point_f nor humidity_pct, assume dew point (°F) = temp_f x this ratio."
unit = "ratio"
source = "Judgement"
range = [0.3, 1.0]

[params.cold_penalty_per_deg]
value = 0.03
description = "Pace slowdown percentage per degree below 32°F freezing."
unit = "%/°F"
source = "DRAFT (Judgement) — verify"
range = [0.0, 0.20]

[formulas.predict]
expr = "t * (D / d) ** k"
description = "Riegel projection of one race (time t at distance d) to distance D with exponent k. weighted_riegel: always used (an override replaces the median; bands keep their widths). curve: used only when overridden (instead of predict_time)."
variables = ["t", "d", "D", "k"]

[formulas.exponent]
expr = "riegel_exponent + male * exponent_offset_male + female * exponent_offset_female"
description = "Riegel exponent b for this runner (male / female are 1 or 0; both 0 when gender is not given)."
variables = ["male", "female"]

[formulas.race_weight]
expr = "exp(-abs(x) / race_weight_distance_scale) * 0.5 ** (years / race_weight_half_life_years)"
description = "Weight of one race: falls with the distance ratio x = ln(D/d) and halves every race_weight_half_life_years before the target (weighted_riegel)."
variables = ["x", "years"]

[formulas.band_log_quantile]
expr = "a + b_gap * gap + b_years * years + b_races / races"
description = "One quantile of ln(actual / predicted); a, b_gap, b_years, b_races are the params band_<quantile>_base / _gap / _years / _races."
variables = ["a", "b_gap", "b_years", "b_races", "gap", "years", "races"]

[formulas.median_time]
expr = "point * exp(q50)"
description = "Median finish time: the weighted Riegel point times the fitted median log error (corrects any bias)."
variables = ["point", "q50"]

[formulas.band_time]
expr = "median * exp(band_scale * (q - q50))"
description = "Time at quantile q (log error) around the median; band_scale widens or narrows every band."
variables = ["median", "q", "q50"]


[formulas.predict_time]
expr = "exp(alpha + beta1 * log(D / 5000.0) + beta2 * (log(D / 5000.0)) ** 2)"
description = "(curve method) Log-quadratic power law projecting finish time at target distance D from fitted parameters."
variables = ["alpha", "beta1", "beta2", "D"]

[formulas.sigma_pct]
expr = "sqrt(base_uncertainty_pct ** 2 + (gap * extrapolation_uncertainty_pct) ** 2 + temporal_sigma_pct ** 2)"
description = "(curve method) Total 1-sigma uncertainty combining baseline variability, distance extrapolation gap, and temporal drift."
variables = ["gap", "temporal_sigma_pct"]

[formulas.transfer_improvement]
expr = "delta_v * transfer_factor"
description = "(curve method) Effective velocity improvement transferred across distances."
variables = ["delta_v", "transfer_factor"]

[formulas.elevation_multiplier]
expr = "1.0 + (uphill_cost_pct_per_grade_pct * up_grade_pct - downhill_credit_ratio * uphill_cost_pct_per_grade_pct * down_grade_pct) / 100.0"
description = "Elevation course factor scaling neutral time for climbing and descending."
variables = ["up_grade_pct", "down_grade_pct"]

[formulas.altitude_multiplier]
expr = "1.0 + (altitude_cost_pct_per_1000m * max(0.0, altitude_m - altitude_threshold_m) / 1000.0) / 100.0"
description = "Hypoxic altitude factor scaling neutral time above threshold."
variables = ["altitude_m"]

[formulas.weather_penalty_pct]
expr = "max(0.0, temp_f + dew_point_f - 100.0) * heat_penalty_per_deg * (distance_m / 5000.0) ** weather_dist_exponent + max(0.0, 32.0 - temp_f) * cold_penalty_per_deg"
description = "Weather slowdown (%) from heat + humidity (temp + dew point above 100°F, growing with distance) and cold below 32°F."
variables = ["temp_f", "dew_point_f", "distance_m"]

[formulas.course_adjusted_time]
expr = "neutral_time * total_multiplier"
description = "Projects course finish time from neutral baseline and combined environmental multipliers."
