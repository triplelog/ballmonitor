# ── formulas ────────────────────────────────────────────────────────────────

[formulas.rep_index]
expr = "weight * (1 + reps / rep_divisor)"
description = "Strength number of a set given in reps (Epley's one-rep max). Must be weight times a factor of reps (the output divides by it)."
variables = ["weight", "reps"]

[formulas.duration_index]
expr = "weight"
description = "Strength number of a set given as a duration in seconds (fit20 style): the load itself, as in Steele et al. (2022). Must be weight times a factor of duration."
variables = ["weight", "duration"]

[formulas.pace]
expr = "clamp(freq / consistency_ref_per_week, pace_min, pace_max) ** consistency_exponent"
description = "Training-clock speed from sessions per week (1 with the default exponent 0)."
variables = ["freq"]

[formulas.expected_gain]
expr = "gain_max * (exp(-weeks / gain_tau_weeks) - exp(-(weeks + h * pace) / gain_tau_weeks))"
description = "Median log gain from today to the target: the part of the saturating curve A (1 - exp(-t / tau)) between weeks trained now and at the target. Also available: slope (recent trend per week), sessions (logged sessions)."
variables = ["weeks", "h", "pace", "slope", "sessions"]

[formulas.band_log_quantile]
expr = "a + b_h * horizon + b_nov * novice + b_irr * irregular + b_gap * gap"
description = "One quantile of the log error ln(actual / (current * exp(gain))); a, b_* are the band_<level>_* params."
variables = ["a", "b_h", "b_nov", "b_irr", "b_gap", "horizon", "novice", "irregular", "gap"]

[formulas.median_value]
expr = "current * exp(gain + q50)"
description = "Median strength number at the target date."
variables = ["current", "gain", "q50"]

[formulas.band_value]
expr = "median * exp(band_scale * (q - q50))"
description = "Strength number at one quantile level, from the median and the fitted log quantiles."
variables = ["median", "q", "q50"]
