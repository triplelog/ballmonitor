[meta]
title = "Running progress"
version = "0.1.1"
status = "calibrated"  # stub | draft | calibrated
question = "Given a runner's training log up to today, what will their average pace and weekly distance be in the four weeks before a chosen future date, and will they still be training?"
description = """
Location-scale forecasts from a few log features. The median 4-week pace is the 12-week pace \
moved by the recent trend (last 4 vs 12 weeks), the longer trend (12 vs up to 26 weeks), the \
season and a pull towards the typical runner; weekly distance works the same way; the chance \
of still running is a small logistic regression. The 50/80/95% bands are the empirical \
quantiles of the errors of BMClab/Strava marathon runners (2019), scaled by a fitted spread \
that grows with the horizon. Implied marathon times use Tanda's (2011) formula and are NOT \
validated on this data.
"""
assumptions = [
    "Your log looks like those of the 36,412 Strava users in the BMClab dataset: people who had run a World Marathon Major, mostly men (76%) aged 35-54, mostly in the US and UK.",
    "Average pace = total time / total distance over 4 weeks. It mixes easy runs, workouts and races, so it tracks fitness only loosely; a change of training mix moves it as much as a change of fitness.",
    "Weeks with an average pace outside 3:00-15:00 min/km or more than 300 km are treated as missing (probably cycling or GPS errors).",
    "Seasonality is the 2019 pattern of these runners (marathon cycles: most volume in September, least in December); southern-hemisphere countries use the same curve shifted six months.",
    "'Still training' means at least one run logged in the 4 weeks before the target date; stopping logging looks the same as stopping running.",
    "The bands were fitted on 2019 and checked on Jan-Mar 2020 (before COVID-19 lockdowns) for other runners; 2020 after March is shown separately in RESEARCH.md because lockdowns changed training.",
    "The implied marathon times come from Tanda (2011), fitted on 22 runners whose marathons took 2:47-3:36; they were not checked on this data (it has no race results).",
]

[web]
public = true

# ── reading the log ────────────────────────────────────────────────────────

[params.min_pace_min_per_km]
value = 3.0
description = "A week whose average pace is faster than this is treated as missing (probably cycling or a GPS error)."
unit = "min/km"
source = "Judgement: 3:00/km for a whole week is elite-marathoner training pace; 0.1% of BMClab run weeks are faster. See RESEARCH.md (cleaning)."
range = [1.5, 6.0]

[params.max_pace_min_per_km]
value = 15.0
description = "A week whose average pace is slower than this is treated as missing (walking, or a watch left running)."
unit = "min/km"
source = "Judgement: 15:00/km is a slow walk; 0.3% of BMClab run weeks are slower. See RESEARCH.md (cleaning)."
range = [8.0, 30.0]

[params.max_week_km]
value = 300.0
description = "A week with more than this many km is treated as missing."
unit = "km"
source = "Judgement: above the 99.99th percentile (261 km) of BMClab weeks."
range = [100.0, 1000.0]

[params.recent_weeks]
value = 4
description = "Weeks in the 'recent' window (pace and distance trend). The bands were fitted with 4."
unit = "weeks"
source = "Choice of research.py (4 = the outcome window); changing it invalidates the fitted coefficients."
range = [2, 8]

[params.base_weeks]
value = 12
description = "Weeks in the 'base' window: the starting point for every forecast. The bands were fitted with 12."
unit = "weeks"
source = "research.py: the 12-week pace has a smaller error as a forecast than the 4-week pace at every horizon (RESEARCH.md, baselines); changing it invalidates the fitted coefficients."
range = [6, 26]

[params.lookback_weeks]
value = 26
description = "Longest history used ('long' window). Older log entries are ignored. Fitted with up to 26 (shorter for early-2019 cutoffs)."
unit = "weeks"
source = "Choice of research.py (half a year, within the 2-year dataset)."
range = [12, 52]

[params.target_weeks]
value = 4
description = "The outcome window: the forecast is for the 4 weeks ending on the target date. Fitted with 4 only."
unit = "weeks"
source = "Choice of research.py (a month smooths single runs and races)."
choices = [4]

[params.min_run_weeks]
value = 3
description = "At least this many of the last base_weeks weeks must contain a run, else the model refuses (no current pace to start from)."
unit = "weeks"
source = "Case selection of research.py (the bands are only valid for such runners)."
range = [1, 12]

[params.km_offset]
value = 1.0
description = "Added to weekly km before taking logs, so rest weeks (0 km) stay finite."
unit = "km"
source = "Judgement (1 km/week is negligible training)."
range = [0.1, 10.0]

[params.min_horizon_weeks]
value = 4
description = "Shortest horizon: the target window must lie entirely after today. Horizons are measured as log(h / min_horizon_weeks) in the formulas."
unit = "weeks"
source = "Definition (target_weeks)."
range = [4, 4]

[params.max_horizon_weeks]
value = 26
description = "Longest horizon the model accepts; the fit used 4-26 weeks."
unit = "weeks"
source = "Range of research.py's cases."
range = [4, 52]

[params.interval_level]
value = 0.8
description = "Which band is shown in the result table's range column (the notes always show 50% and 95%)."
unit = "level"
source = "Convention of race_time."
choices = [0.5, 0.8, 0.95]

# ── reference runner (the pull towards the typical runner) ─────────────────

[params.ref_pace]
value = 332.0
description = "Typical 12-week average pace of the training runners (median), used as 'rel' = ln(base pace / ref_pace)."
unit = "s/km"
source = "research.py: median base pace of the train cases; see RESEARCH.md."
range = [180.0, 600.0]

[params.ref_km]
value = 28.4
description = "Typical 12-week mean weekly km of the training runners (median), used as ln((base km + km_offset) / (ref_km + km_offset))."
unit = "km/week"
source = "research.py: median base km/week of the train cases; see RESEARCH.md."
range = [1.0, 200.0]

