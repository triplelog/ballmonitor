# ── formulas ───────────────────────────────────────────────────────────────

[formulas.pace_location]
expr = "lp_base + pace_loc_a + pace_loc_recent * tr_recent + pace_loc_long * tr_long + pace_loc_season * season + pace_loc_rel * (lp_base - log(ref_pace))"
description = "Location of ln(4-week pace at the target, s/km): the 12-week pace moved by the trends, the season and the pull towards ref_pace."
variables = ["lp_base", "tr_recent", "tr_long", "season"]

[formulas.pace_scale]
expr = "exp(pace_scale_a + pace_scale_h * log(h / min_horizon_weeks) + pace_scale_share * share + pace_scale_rel * (lp_base - log(ref_pace)) + pace_scale_trend * abs(tr_recent))"
description = "Scale of the ln-pace error: widens with the horizon h (weeks), shrinks or grows with consistency, pace level and a recent change."
variables = ["h", "share", "lp_base", "tr_recent"]

[formulas.pace_quantile]
expr = "exp(loc + scale * z)"
description = "Pace (s/km) at a quantile: location + scale x the standardised error quantile z (pace_z_*)."
variables = ["loc", "scale", "z"]

[formulas.km_location]
expr = "lk_base + km_loc_a + km_loc_recent * ktr_recent + km_loc_long * ktr_long + km_loc_season * season + km_loc_share * share + km_loc_rel * (lk_base - log(ref_km + km_offset))"
description = "Location of ln(km/week + km_offset) over the 4 weeks before the target, given still training."
variables = ["lk_base", "ktr_recent", "ktr_long", "season", "share"]

[formulas.km_scale]
expr = "exp(km_scale_a + km_scale_h * log(h / min_horizon_weeks) + km_scale_share * share + km_scale_rel * (lk_base - log(ref_km + km_offset)) + km_scale_trend * abs(ktr_recent))"
description = "Scale of the ln(km/week + km_offset) error."
variables = ["h", "share", "lk_base", "ktr_recent"]

[formulas.km_quantile]
expr = "max(exp(loc + scale * z) - km_offset, 0)"
description = "Weekly km at a quantile, given still training."
variables = ["loc", "scale", "z"]

[formulas.p_running]
expr = "logistic(run_a + run_share * share + run_since * since + run_level * (lk_base - log(ref_km + km_offset)) + run_h * log(h / min_horizon_weeks))"
description = "Chance of at least one run in the 4 weeks before the target date."
variables = ["share", "since", "lk_base", "h"]

[formulas.tanda_marathon]
expr = "marathon_km * (tanda_a + tanda_b * exp(-tanda_k * K) + tanda_c * P)"
description = "Tanda (2011) marathon time (s) from mean weekly km K and mean training pace P (s/km) over 8 weeks. Literature formula, not validated on this data."
variables = ["K", "P"]
