[formulas.expected_spread]
expr = "default_rating - opponent_rating + hca"
description = "Expected point or run spread for the default team against the opponent."
variables = ["default_rating", "opponent_rating", "hca"]

[formulas.game_performance]
expr = "clamp(margin, -margin_cap_sd * sigma, margin_cap_sd * sigma) + win_bonus_sd * sigma * (1 if margin > 0 else (-1 if margin < 0 else 0))"
description = "Per-game performance used for DAD and strength: the margin, optionally capped (margin_cap_sd) and with a win bonus (win_bonus_sd). Defaults leave the margin unchanged (the study's winner)."
variables = ["margin", "sigma"]

[formulas.game_dad]
expr = "weight * (performance - expected_spread) / sigma"
description = "Deviations above default for one game (margin scale): how far the game's performance beat what the default team would be expected to do against that opponent at that venue, in per-game margin SDs, times the game weight."
variables = ["performance", "expected_spread", "sigma", "weight"]

[formulas.strength_rating]
expr = "weighted_sum / (weight_total + prior_games)"
description = "Strength rating: recency-weighted mean of opponent-adjusted performances (performance + opponent rating - home edge), shrunk toward the league average (0) by prior_games phantom average games."
variables = ["weighted_sum", "weight_total", "prior_games"]

[formulas.strength_dad]
expr = "(strength - default_rating) / sigma"
description = "DAD per game (primary): how many per-game margin SDs the team's strength is above the default team's rating."
variables = ["strength", "default_rating", "sigma"]

[formulas.recency_weight]
expr = "0.5 ** (days_ago / half_life) if half_life > 0 else 1.0"
description = "Weight of a game in the strength rating: halves every half_life days before the latest game; 1 when half_life is 0."
variables = ["days_ago", "half_life"]

[formulas.game_wad]
expr = "weight * (result - p_default)"
description = "Wins above default for one game: actual result (1 win, draw value, 0 loss) minus the chance the default team would win that game, times the game weight."
variables = ["result", "p_default", "weight"]

[formulas.game_dad_probit]
expr = "weight * clamp((p_actual - p_default) / sqrt(p_default * (1.0 - p_default)), -game_dad_cap, game_dad_cap)"
description = "v0.6.0 DAD (dad_scale = probit): win-strength deviation above default standardised by the binomial SD, capped at ±game_dad_cap, scaled by game weight."
variables = ["p_actual", "p_default", "weight"]

[formulas.game_wad_strength]
expr = "weight * (p_actual - p_default)"
description = "v0.6.0 WAD (wad_mode = strength): margin-based win strength minus the default team's win strength, scaled by game weight."
variables = ["p_actual", "p_default", "weight"]
