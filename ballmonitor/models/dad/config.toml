[meta]
title = "DAD (Deviations Above Default)"
version = "0.7.0"
status = "calibrated"
question = "How many per-game standard deviations better than a chosen default team (bubble, champion, average, replacement) is a team, and how many wins above that default did its schedule produce?"
description = """
DAD compares a team with a chosen default team (bubble, top-4 seed, champion,
average or replacement level) against the same schedule. Since v0.7.0 it keeps two
questions apart. STRENGTH (primary): the team's opponent-adjusted margin per game
(margin + opponent rating - home edge), shrunk toward average by a few phantom
average games, minus the default team's rating, divided by the per-game margin
SD -> "DAD per game" in sigma, plus the same gap in points/goals/runs and as a win
chance vs the default. RESUME: Total DAD (sum over games of (margin - default's
expected spread) / sigma) and WAD, wins above default (result minus the chance the
default team would have won that game). The v0.6.0 probit DAD is kept as the
v06_probit variant (dad_scale = probit). Supports basketball (men's and women's),
football, soccer, MLB, college baseball and college softball.
"""
assumptions = [
  "Opponent and baseline ratings are least-squares margin ratings (points/goals/runs per game vs an average team on a neutral field), as in data/team_ratings.csv; the model takes them as given.",
  "A game's margin is the performance signal, uncapped: in RESEARCH_STRENGTH.md no cap, tanh/log compression or win bonus predicted future games better than the raw margin.",
  "Strength shrinks toward the league average by prior_games phantom average games (tuned per sport family: basketball 1, football 2, MLB 32, soccer 4); all games count equally unless a half-life is set.",
  "Deviations are measured in per-game margin SDs (10.6 pts MBB, 11.2 WBB, 13.8 football, 1.6 goals, 4.4 runs MLB); win chances vs the default use the normal CDF, Skellam (soccer) or Pythagorean (baseball).",
  "Home advantage is one additive edge per sport (3.2 pts MBB/NBA, 2.9 WBB, 2.1 football, 0.35 goals, 0.14 runs).",
  "WAD counts results only (win 1, draw 1/2, loss 0) against the chance the default team wins the same game; margins do not enter WAD.",
  "Game weights (derbies, cups, college weekend/midweek/postseason) scale the résumé totals (Total DAD, WAD) but not the strength rating.",
  "College baseball and softball constants are judgement values: no complete public game data to test them.",
]

[params.default_baseline]
value = "bubble"
description = "Default comparison baseline if not explicitly specified in input."
source = "Judgement."
choices = ["bubble", "champion", "top_4_seed", "average", "replacement"]

