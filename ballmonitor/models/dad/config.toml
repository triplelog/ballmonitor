[params.game_dad_cap]
value = 2.0
description = "dad_scale = probit only (v0.6.0 DAD): largest deviation one game can contribute, in σ (before the game weight). Stops a single upset against an extreme baseline (e.g. replacement level) from dominating the total. 100 = effectively no cap."
source = "RESEARCH.md (dad v0.6.0 study): chosen on development seasons (<=2020) from 0.5/1/1.5/2/3/none; on 2021+ test seasons the v0.6.0 config beats v0.5.0 slightly (RMSE x0.995-0.997) and the largest single game falls from 10-14 sigma to 2."
unit = "sigma"
range = [0.25, 100.0]

[params.dad_scale]
value = "margin"
description = "How a game's deviation is measured. margin (v0.7.0): (performance - default team's expected spread) / sigma, in margin SDs; the primary output is the shrunk opponent-adjusted strength vs the default, in sigma per game. probit: the v0.6.0 win-strength z-score (P_actual - P_default) / sqrt(P_default(1 - P_default)) with game_dad_cap, primary output = total DAD."
source = "RESEARCH_STRENGTH.md (dad v0.7.0 study): the margin-scale strength beats the v0.6.0 probit DAD out of sample in every sport family (game-level walk-forward and half-season test)."
choices = ["margin", "probit"]

[params.wad_mode]
value = "result"
description = "WAD definition. result (v0.7.0): actual result (win 1, draw 1/2, loss 0) minus the chance the default team wins that game, i.e. wins above default ('wins above bubble'). strength: v0.6.0 margin-based win strength minus the default's win strength."
source = "Résumé definition (wins above bubble, as used for NCAA selection résumés); v0.6.0 behaviour kept as 'strength'."
choices = ["result", "strength"]

[params.margin_cap_sd]
value = 100.0
description = "Cap on a single game's margin, in margin SDs (sigma), applied in game_performance before rating/DAD. 100 = no cap."
source = "RESEARCH_STRENGTH.md (dad v0.7.0 study): every cap tried (basketball 10-40 pts, football 14-45, baseball 2-8 runs, soccer 1-4 goals) predicted worse than the raw margin on development seasons, so the default is no cap."
unit = "sigma"
range = [0.5, 100.0]

[params.win_bonus_sd]
value = 0.0
description = "Bonus added to a win's margin (subtracted for a loss), in margin SDs (sigma), in game_performance. 0 = margin only."
source = "RESEARCH_STRENGTH.md (dad v0.7.0 study): win bonuses gained less than the 0.1% dev-score threshold over the raw margin, so the default is 0."
unit = "sigma"
range = [0.0, 1.0]

[params.soccer_margin_sd]
value = 1.6
description = "Per-game goal-margin noise sigma in soccer (residual SD around least-squares ratings); the unit of soccer DAD."
source = "RESEARCH.md (dad v0.6.0 study): residual SD, Big-5 leagues 2015-16 to 2019-20 (1.53-1.76, pooled ~1.6)."
unit = "goals"
range = [0.8, 3.0]

[params.mlb_margin_sd]
value = 4.4
description = "Per-game run-margin noise sigma in MLB (residual SD around least-squares ratings); the unit of MLB DAD."
source = "RESEARCH.md (dad v0.6.0 study): residual SD, MLB 2015-2019 (4.37 runs)."
unit = "runs"
range = [2.0, 8.0]

[params.college_baseball_margin_sd]
value = 6.0
description = "Per-game run-margin noise sigma in college baseball; the unit of college-baseball DAD."
source = "DRAFT judgement (higher scoring than MLB's 4.4; no complete public game data) - verify."
unit = "runs"
range = [2.0, 12.0]

[params.softball_margin_sd]
value = 5.0
description = "Per-game run-margin noise sigma in college softball; the unit of softball DAD."
source = "DRAFT judgement (no complete public game data) - verify."
unit = "runs"
range = [2.0, 12.0]

[params.prior_games_basketball]
value = 1.0
description = "Strength shrinkage for NCAA M/W basketball and NBA: phantom games against an average team (rating 0) added to a team's schedule, so short schedules are pulled toward average."
source = "RESEARCH_STRENGTH.md (dad v0.7.0 study): ridge chosen on development seasons (<=2020) from 0.1-256 by game-level walk-forward margin RMSE with the rating taken at face value (basketball family)."
unit = "games"
range = [0.0, 300.0]

[params.half_life_days_basketball]
value = 0.0
description = "Recency weighting of the strength rating for NCAA M/W basketball and NBA: a game's weight halves every this many days before the latest game (or `as_of`). 0 = all games count equally. Needs game dates."
source = "RESEARCH_STRENGTH.md (dad v0.7.0 study): half-lives of 30-240 days gained less than the 0.1% dev-score threshold over equal weights (basketball family), so recency is off by default."
unit = "days"
range = [0.0, 1000.0]

