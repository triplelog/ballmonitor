[meta]
title = "Lichess rating progress"
version = "0.1.0"
status = "calibrated"  # stub | draft | calibrated
question = "What will this player's Lichess rating be on a chosen future date?"
description = """
Two parts, both fitted on real Lichess players (open database, 2014-2017, walk-forward):
the chance the player plays again in this speed before the target date (if not, the rating
stays where it is), and the range of the change if they do, from a quantile regression on
current rating, experience, recent activity, distance below their peak, 3-month trend and
recent results.
"""
assumptions = [
  "The player keeps playing about as before; 'keep_playing = true' assumes at least one more rated game.",
  "Fitted on Lichess blitz players from 2014-2017; today's rating pool and other speeds may behave differently.",
  "Experience counts the games given; the backtest only saw games from 2014 on.",
  "A rating only changes when you play rated games, so stopping means no change.",
  "Cheating bans, rating refunds and new accounts after a long break are not modelled.",
]

[web]
public = false

# ---- Feature limits (how far each input can push the prediction) ----

[params.cap_games]
value = 5000.0
description = "Experience counts at most this many rated games (more games change little)."
unit = "games"
source = "Judgement (few players in the data have more; keeps ln(1 + games) in the fitted range)."
range = [100.0, 100000.0]

[params.cap_below_peak]
value = 4.0
description = "Distance below the player's peak rating counts up to this many hundred points."
unit = "x100 points"
source = "Judgement (beyond 400 points the peak is usually from a different era of the account)."
range = [0.5, 10.0]

[params.cap_trend]
value = 3.0
description = "3-month rating trend counts up to +- this many hundred points."
unit = "x100 points"
source = "Judgement."
range = [0.5, 10.0]

[params.cap_form]
value = 4.0
description = "Recent performance minus rating counts up to +- this many hundred points."
unit = "x100 points"
source = "Judgement."
range = [0.5, 10.0]

# ---- Output ----

[params.band_scale]
value = 1.0
description = "Multiplies the spread of the change-if-playing quantiles around their median (1 = as fitted)."
source = "Judgement; 1 = the fit in RESEARCH.md."
range = [0.25, 3.0]

[params.interval_level]
value = 0.8
description = "Interval shown with the primary estimate."
choices = [0.5, 0.8, 0.95]
source = "Convention."

[params.milestone_step]
value = 100.0
description = "Rating milestones shown as 'chance to reach' rows are multiples of this above today's rating."
unit = "points"
source = "Judgement (Lichess fans think in hundreds)."
range = [25.0, 500.0]

[formulas.p_active]
expr = "logistic(active_intercept + active_activity * activity + active_idle * idle + active_experience * experience + active_log_horizon * log_horizon)"
description = "Chance of playing at least one more rated game in this speed before the target date."
variables = ["activity", "idle", "experience", "log_horizon"]

# Coefficients fitted by research.py (pinball-loss quantile regression and a logistic
# regression); see RESEARCH.md. Refit with:
#   python -m ballmonitor.models.lichess_rating.research --write-config
# ---- BEGIN FITTED (research.py --write-config; do not edit by hand) ----
