# public site page (site.py only; does not change predictions)

[params.site_hitters]
value = 30
unit = "hitters"
description = "The site's hitter picker lists this many hitters: the best by wOBA over the latest year (next_pitch's data/batters.csv) among those with site_min_pa plate appearances, or the most career PA if that file is missing."
source = "Judgement (page size and build time)."
range = [5, 200]

[params.site_pitchers]
value = 40
unit = "pitchers"
description = "Each hitter on the site is matched against this many pitchers: among those with site_min_pitches pitches in the latest season (next_pitch's data/pitchers.csv) and site_min_profile_pa career PA, the lowest career xwOBA allowed (most career PA if that file is missing)."
source = "Judgement (page size and build time)."
range = [5, 200]

[params.site_min_pa]
value = 250
unit = "PA"
description = "Plate appearances in the latest year a hitter needs to be listed on the site."
source = "Judgement (keeps stars who missed part of the season, e.g. Aaron Judge, 293 PA)."
range = [50, 700]

[params.site_min_pitches]
value = 2000
unit = "pitches"
description = "Pitches in the latest season a pitcher needs to be listed on the site (about a regular starter's workload)."
source = "Judgement."
range = [200, 3500]

[params.site_min_profile_pa]
value = 300
unit = "PA"
description = "Career PA (training seasons) a pitcher needs to be listed on the site, so his ranking isn't driven by a handful of games."
source = "Judgement."
range = [0, 3000]

[formulas.regress]
expr = "(x * n + prior * n0) / (n + n0)"
description = "Regression to a prior: n PA at the observed rate x plus n0 PA at the prior rate."
variables = ["x", "n", "prior", "n0"]

[formulas.log5]
expr = "(pb * pp / pl) / ((pb * pp / pl) + ((1.0 - pb) * (1.0 - pp) / (1.0 - pl)))"
description = "Bill James Log5 odds formula combining batter rate, pitcher rate, and league average."
variables = ["pb", "pp", "pl"]

[formulas.bvp_weight]
expr = "n_direct / (n_direct + bvp_shrinkage_n0)"
description = "Shrinkage weight for direct BvP history."
variables = ["n_direct"]

[formulas.archetype_weight]
expr = "min(max_archetype_weight, (1.0 - w_direct) * (eff_n / (eff_n + archetype_shrinkage_m0)))"
description = "Shrinkage weight given to the pooled archetype matchup."
variables = ["w_direct", "eff_n"]

[formulas.blend_estimate]
expr = "w_direct * y_direct + w_arch * y_arch + (1.0 - w_direct - w_arch) * y_baseline"
description = "Three-tier hierarchical blend of direct BvP, archetype pool, and Log5 baseline."
variables = ["w_direct", "y_direct", "w_arch", "y_arch", "y_baseline"]

[formulas.final_microsim_blend]
expr = "(1.0 - w_ms) * y_archetype_blend + w_ms * y_microsim"
description = "Blends the shrinkage estimate with the count micro-simulation; w_ms is microsim_weight for xwOBA and microsim_weight_rates for K% and BB%."
variables = ["w_ms", "y_archetype_blend", "y_microsim"]

[formulas.interval_half_width]
expr = "z * sqrt(interval_talent_sd ** 2 + per_pa_xwoba_sd ** 2 / n_pa)"
description = "Half-width of the range for the xwOBA observed over n_pa PAs: talent uncertainty plus per-PA sampling noise, z from interval_level."
variables = ["z", "n_pa"]
