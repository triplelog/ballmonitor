[meta]
title = "Batter vs. Pitcher Similarity Matchup"
version = "0.3.1"
status = "calibrated"
question = "What is the expected performance (xwOBA, K%, BB%) when this batter faces this pitcher?"
description = """
Predicts batter vs. pitcher matchup outcomes by blending a regressed platoon Log5 baseline,
pooled matchups between similar pitchers and similar batters, shrunk direct BvP history and a
count-by-count micro-simulation whose rates are measured league averages.
"""
assumptions = [
  "Direct BvP history with small sample sizes (< 50 PA) is mostly random variance and heavily regressed.",
  "Player rates are regressed to the league average, and platoon splits to the player's overall rate, before they are combined.",
  "Pitchers with similar repertoires, velocity, and count strategies induce similar outcomes against comparable batters.",
  "Profiles are 2021-2025 career aggregates with no recency weighting or aging.",
  "The xwOBA range is for what a handful of PAs will show, so it is wide; most of it is sampling noise.",
]

[params.k_pitchers]
value = 8
description = "Number of similar pitchers to include in the pitcher peer pool."
unit = "pitchers"
source = "Judgement (not tuned; RESEARCH.md tunes the pool's weight instead)."
range = [3, 25]

[params.k_batters]
value = 12
description = "Number of similar batters to include in the batter peer pool."
unit = "batters"
source = "Judgement (not tuned; RESEARCH.md tunes the pool's weight instead)."
range = [3, 35]

[params.bvp_shrinkage_n0]
value = 250.0
description = "Sample size constant (N0) for direct BvP history shrinkage."
unit = "PA"
source = "Chosen on 2025 matchups (tables from 2021-2024), walk-forward; reported on 2026 in RESEARCH.md section 2."
range = [10.0, 5000.0]

[params.archetype_shrinkage_m0]
value = 350.0
description = "Effective sample size constant (M0) for archetype pooled matchup shrinkage."
unit = "PA"
source = "Chosen on 2025 matchups (tables from 2021-2024), walk-forward; reported on 2026 in RESEARCH.md section 2."
range = [50.0, 5000.0]

[params.max_archetype_weight]
value = 0.1
description = "Maximum weight given to the archetype pool versus the baseline talent expectation."
source = "Chosen on 2025 matchups (tables from 2021-2024), walk-forward; reported on 2026 in RESEARCH.md section 2."
range = [0.0, 0.85]

[params.microsim_weight]
value = 0.2
description = "Weight given to the count micro-simulation in the xwOBA estimate."
unit = "weight"
source = "Chosen on 2025 matchups (tables from 2021-2024), walk-forward; reported on 2026 in RESEARCH.md section 2."
range = [0.0, 1.0]

[params.microsim_weight_rates]
value = 0.0
description = "Weight given to the count micro-simulation in the K% and BB% estimates."
unit = "weight"
source = "Chosen on 2025 matchups (tables from 2021-2024), walk-forward; reported on 2026 in RESEARCH.md section 2."
range = [0.0, 1.0]

[params.regress_xwoba_pa]
value = 800.0
description = "PA of league average added when regressing a player's xwOBA (overall to league, then platoon split to overall). 1 = essentially no regression."
unit = "PA"
source = "Chosen on 2025 matchups (tables from 2021-2024), walk-forward; reported on 2026 in RESEARCH.md section 2."
range = [1.0, 5000.0]

[params.regress_k_pa]
value = 400.0
description = "PA of league average added when regressing a player's K% (overall to league, then platoon split to overall)."
unit = "PA"
source = "Chosen on 2025 matchups (tables from 2021-2024), walk-forward; reported on 2026 in RESEARCH.md section 2."
range = [1.0, 5000.0]

[params.regress_bb_pa]
value = 200.0
description = "PA of league average added when regressing a player's BB% (overall only; no platoon split)."
unit = "PA"
source = "Chosen on 2025 matchups (tables from 2021-2024), walk-forward; reported on 2026 in RESEARCH.md section 2."
range = [1.0, 5000.0]

[params.league_xwoba]
value = 0.3163
description = "League average expected wOBA per plate appearance (the Log5 reference and regression target)."
unit = "wOBA"
source = "Measured from 2021-2025 Statcast pitches by research.py (RESEARCH.md section 1)."
range = [0.280, 0.360]

[params.league_k_pct]
value = 0.2279
description = "League average strikeout rate per plate appearance."
source = "Measured from 2021-2025 Statcast pitches by research.py (RESEARCH.md section 1)."
range = [0.150, 0.350]

[params.league_bb_pct]
value = 0.0816
description = "League average walk rate per plate appearance."
source = "Measured from 2021-2025 Statcast pitches by research.py (RESEARCH.md section 1)."
range = [0.040, 0.150]

# ── xwOBA range (MODEL.md step 9) ────────────────────────────────────────────

[params.interval_level]
value = 0.80
description = "Coverage level of the xwOBA range."
source = "Convention used across ballmonitor."
range = [0.5, 0.95]

[params.interval_pa]
value = 3
description = "Number of PAs the xwOBA range is for when the input `pa` is not given (a starter faces a hitter about 3 times a game)."
unit = "PA"
source = "Judgement (typical times a starter faces a batter in one game)."
range = [1, 100]

[params.per_pa_xwoba_sd]
value = 0.25
description = "Effective standard deviation of a single PA's xwOBA for the range (the raw SD is about 0.37, but one PA's xwOBA is lumpy, so a normal band with it over-covers)."
unit = "wOBA"
source = "Fitted on 2025 matchups so each PA bucket covers about 80% (walk-forward); 2026 coverage in RESEARCH.md section 3."
range = [0.2, 0.6]

[params.interval_talent_sd]
value = 0.15
description = "Spread added in quadrature to the per-PA noise in the range. Fitted for coverage, so it also absorbs the non-normal shape of small samples; it is not a measured talent uncertainty."
unit = "wOBA"
source = "Fitted on 2025 matchups so each PA bucket covers about 80% (walk-forward); 2026 coverage in RESEARCH.md section 3."
range = [0.0, 0.3]

# ── count micro-simulation (MODEL.md step 7) ─────────────────────────────────
# league rates per count group: first = 0-0; even = 1-0, 0-1, 1-1;
# behind = 2-0, 3-0, 2-1, 3-1; two = any count with two strikes

