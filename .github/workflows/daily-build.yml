name: Daily Data Refresh & Static Site Build

on:
  schedule:
    # Daily at 12:00 UTC (8 AM EDT): after late West Coast games and ESPN's Monday FPI update.
    - cron: '0 12 * * *'
    # Football Saturdays (Aug-Jan), as games end: 19:00 and 23:00 UTC Saturday, 03:00 and
    # 07:00 UTC Sunday (3 PM, 7 PM, 11 PM, 3 AM EDT). Which models fetch is decided by each
    # config.toml [fetch] season, so out-of-season runs only rebuild.
    - cron: '0 19,23 * 8-12,1 6'
    - cron: '0 3,7 * 8-12,1 0'
  workflow_dispatch: # "Run workflow" button in the Actions tab, or `gh workflow run daily-build.yml`
    inputs:
      models:
        description: "Models to fetch, comma-separated (e.g. ncaaf_bowls). Empty = the scheduled ones."
        required: false
        default: ""
  push:
    branches:
      - main
    paths:
      - 'ballmonitor/models/**'
      - 'ballmonitor/web/**'
      - 'ballmonitor/core/**'
      - 'ballmonitor/games/**'
      - 'ballmonitor/new27K/**'
      - 'ballmonitor/charts/**'
      - 'pyproject.toml'
      - '.github/workflows/daily-build.yml'

# Permissions for deploying to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # Build and deploy are separate jobs (GitHub's own Pages templates do this): the deploy job starts
  # only after the build job and its artifact upload have finished. In one job, deploy-pages twice
  # asked for the artifact a second or two after the upload and GitHub didn't list it yet ("No
  # artifacts named github-pages were found", 2026-11-19 and 2026-11-22); the data and site were fine.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[data,ml]'

      # Scheduled fetches that keep state between runs (data/raw/scheduled/, e.g. which
      # recruits' On3 offer lists were last read when) get it back here; saved after the job
      # under a new key each run, restored from the newest one. A miss is fine: the model
      # starts again from its committed data.
      - name: Restore scheduled-fetch state
        uses: actions/cache@v6
        with:
          path: ballmonitor/models/*/data/raw/scheduled
          key: scheduled-fetch-${{ github.run_id }}
          restore-keys: scheduled-fetch-

      - name: Fetch fresh data and build static site
        env:
          MODELS: ${{ inputs.models }}
        run: |
          if [ -n "$MODELS" ]; then
            python -m ballmonitor update-and-build --out dist --models "$MODELS"
          else
            python -m ballmonitor update-and-build --out dist
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'dist'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      # one more try after a pause if GitHub was slow to list the artifact (or had a hiccup)
      - name: Wait before retrying
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Retry deploy
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
