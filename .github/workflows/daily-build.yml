name: Daily Data Refresh & Static Site Build

on:
  schedule:
    # Daily at 12:00 UTC (8 AM EDT): after late West Coast games and ESPN's Monday FPI update.
    - cron: '0 12 * * *'
    # Football Saturdays (Aug-Jan), as games end: 19:00 and 23:00 UTC Saturday, 03:00 and
    # 07:00 UTC Sunday (3 PM, 7 PM, 11 PM, 3 AM EDT). Which models fetch is decided by each
    # config.toml [fetch] season, so out-of-season runs only rebuild.
    - cron: '0 19,23 * 8-12,1 6'
    - cron: '0 3,7 * 8-12,1 0'
  workflow_dispatch: # "Run workflow" button in the Actions tab, or `gh workflow run daily-build.yml`
    inputs:
      models:
        description: "Models to fetch, comma-separated (e.g. ncaaf_bowls). Empty = the scheduled ones."
        required: false
        default: ""
  push:
    branches:
      - main
    paths:
      - 'ballmonitor/models/**'
      - 'ballmonitor/web/**'
      - 'ballmonitor/core/**'
      - 'ballmonitor/games/**'
      - 'ballmonitor/new27K/**'
      - 'pyproject.toml'
      - '.github/workflows/daily-build.yml'

# Permissions for deploying to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[data,ml]'

      - name: Fetch fresh data and build static site
        env:
          MODELS: ${{ inputs.models }}
        run: |
          if [ -n "$MODELS" ]; then
            python -m ballmonitor update-and-build --out dist --models "$MODELS"
          else
            python -m ballmonitor update-and-build --out dist
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
